name: Native test environment
description: Install the Linux Rust toolchain, fonts and display/Vulkan test dependencies.
inputs:
  cache-key:
    description: Independent Cargo cache for this test suite.
    required: true
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
      with:
        toolchain: stable
        components: clippy
        cache-shared-key: native-${{ inputs.cache-key }}
    - name: Install native libraries, fonts and software Vulkan
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libfontconfig1-dev libpango1.0-dev libwayland-dev libxkbcommon-dev \
          libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
          libvulkan1 mesa-vulkan-drivers fonts-dejavu-core fonts-noto-cjk \
          xvfb xdotool imagemagick vulkan-validationlayers
        mkdir -p "$XDG_RUNTIME_DIR"
        chmod 700 "$XDG_RUNTIME_DIR"
