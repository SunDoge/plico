name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'release-plz.toml'
      - '.github/dependabot.yml'
      - '.gitignore'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'release-plz.toml'
      - '.github/dependabot.yml'
      - '.gitignore'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Lightweight Rust checks
    runs-on: ubuntu-24.04
    # A cold Ubuntu runner can spend more than ten minutes refreshing apt and
    # installing the native text/window headers before Clippy starts. Keep the
    # individual commands bounded by the job, without cancelling a healthy
    # cold-cache run halfway through dependency installation.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          cache-key: workspace-ci-v2
          cache-workspace-crates: true
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          components: rustfmt,clippy
          target: wasm32-unknown-unknown
      - name: Check Rust and component formatting
        run: cargo run --locked --profile ci -p plico-cli -- fmt --check
      - name: Guard application widget boundaries
        run: python3 scripts/check-widget-boundary.py
      - name: Guard renderer backend boundaries
        run: python3 scripts/check-renderer-boundary.py
      - name: Guard runtime source boundaries
        run: python3 scripts/check-runtime-boundary.py
      - name: Test the renderer-independent packages
        run: cargo test --locked --profile ci -p plico -p plico-macros -p plico-motion -p plico-dev -p plico-cli -p plico-markdown -p plico-i18n --all-targets --all-features
      - name: Install desktop compile dependencies
        run: |
          packages=(
            pkg-config libfontconfig1-dev libpango1.0-dev libwayland-dev libxkbcommon-dev
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev
          )

          # Azure-backed Ubuntu mirrors occasionally stop resolving on hosted
          # runners even though the rest of the network is healthy. Resolve only
          # the official mirror names through a public resolver as a fallback.
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if timeout 5s getent ahostsv4 "${host}" >/dev/null; then
              continue
            fi

            address=""
            for resolver in 1.1.1.1 8.8.8.8; do
              address="$(timeout 10s dig +short A "${host}" "@${resolver}" \
                | awk '/^[0-9.]+$/ { print; exit }' || true)"
              [[ -n "${address}" ]] && break
            done
            if [[ -z "${address}" ]]; then
              echo "Could not resolve ${host} through the runner or fallback DNS" >&2
              exit 1
            fi
            echo "${address} ${host}" | sudo tee -a /etc/hosts
          done

          # Apt otherwise waits once per package, which can consume the whole
          # job timeout. Require a complete index refresh and retry the operation
          # as a unit with bounded network and process waits.
          for attempt in 1 2 3; do
            if timeout --kill-after=5s 90s sudo apt-get \
              -o Acquire::Retries=0 \
              -o Acquire::http::Timeout=10 \
              -o Acquire::https::Timeout=10 \
              update --error-on=any \
              && timeout --kill-after=5s 120s sudo apt-get \
                -o Acquire::Retries=0 \
                -o Acquire::http::Timeout=10 \
                -o Acquire::https::Timeout=10 \
                install -y --no-install-recommends "${packages[@]}"
            then
              break
            fi

            if (( attempt == 3 )); then
              echo "Desktop dependency installation failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep 5
          done
      - name: Lint the mainline without optional backend SDKs
        run: cargo clippy --locked --profile ci --workspace --exclude plico-lvgl --exclude lvgl-esp32p4 --exclude plico-fltk --exclude plico-bevy --features backend-settings/skia,backend-settings/wgpu,plico-shell/global-hotkeys --all-targets -- -D warnings
      # The optional Bevy adapter is checked as a library. Do not pull its PBR
      # example/test dependency graph into every workspace Clippy invocation.
      - name: Check the Bevy plugin library
        run: cargo clippy --locked --profile ci -p plico-bevy --lib -- -D warnings
      - name: Check browser host and split UI with wgpu
        run: cargo clippy --locked --profile ci -p plico-web-host --features gallery,split --target wasm32-unknown-unknown -- -D warnings
      - name: Verify the semantic test protocol without a window
        run: cargo test --locked --profile ci -p plico-runtime --test test_protocol

  windows:
    name: Windows MSVC compile
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          cache-key: workspace-ci-v2
          cache-workspace-crates: true
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Windows MSVC with Skia and wgpu
        run: cargo check --locked --profile ci --target x86_64-pc-windows-msvc --workspace --exclude plico-lvgl --exclude lvgl-esp32p4 --exclude plico-fltk --exclude plico-bevy --features plico-desktop/skia,backend-settings/skia,backend-settings/wgpu,plico-shell/global-hotkeys --all-targets
      - name: Check the Bevy plugin on Windows MSVC
        run: cargo check --locked --profile ci --target x86_64-pc-windows-msvc -p plico-bevy --lib
