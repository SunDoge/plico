name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Formatting and workspace versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
          components: rustfmt
      - uses: jdx/mise-action@9a35c22ab9022da3f8dbd8c6f42221c5224f78e1 # v5
      - name: Check shared package version
        run: python3 scripts/check-versions.py
      - name: Check Rust and component formatting
        run: cargo run --locked -p plico-cli -- fmt --check
      - name: Report unused dependencies
        run: mise exec -- cargo-machete --with-metadata

  lint:
    name: Linux Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      XDG_RUNTIME_DIR: /tmp/plico-ci-runtime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
          components: clippy
          cache-shared-key: native
      - name: Install native libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            fonts-dejavu-core fonts-noto-cjk
      - name: Check every target and feature
        run: cargo clippy --locked --workspace --exclude plico-lvgl --exclude plico-lvgl-esp32p4 --all-targets --all-features -- -D warnings

  native:
    name: Linux tests and hot reload
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      XDG_RUNTIME_DIR: /tmp/plico-ci-runtime
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
          cache-shared-key: native
      - name: Install native libraries, fonts and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libvulkan1 mesa-vulkan-drivers fonts-dejavu-core fonts-noto-cjk
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Run workspace tests, including headless rendering
        run: cargo test --locked --workspace --exclude plico-lvgl --exclude plico-lvgl-esp32p4 --all-features
      - name: Verify profiling with and without a trace file
        run: |
          env -u PLICO_TRACE_FILE cargo run --locked -p plico-vello --features profiling --example trace_span
          PLICO_TRACE_FILE="$RUNNER_TEMP/plico-trace.json" cargo run --locked -p plico-vello --features profiling --example trace_span
      - name: Build the CLI and native development host
        run: cargo build --locked -p plico-cli -p plico-vello
      - name: Verify generated app, reload recovery and native text input
        run: |
          python3 scripts/check-hotreload.py
          python3 scripts/check-text-input-reload.py

  windows:
    name: Windows build and core tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
      - name: Check the whole workspace compiles on Windows
        run: cargo check --locked --workspace --exclude plico-lvgl --exclude plico-lvgl-esp32p4 --all-targets --all-features
      - name: Run renderer-independent core tests
        run: cargo test --locked -p plico-core --all-features

  wasm:
    name: WASM host and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Check the renderer-independent core
        run: cargo check --locked -p plico-core --target wasm32-unknown-unknown
      - name: Check the gallery and split host
        run: cargo clippy --locked -p plico-web-host --features gallery,split --target wasm32-unknown-unknown -- -D warnings
      - name: Check the loadable UI module
        run: cargo check --locked -p plico-web-demo --all-features --target wasm32-unknown-unknown

  lvgl:
    name: LVGL backend experiment (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEP_LV_CONFIG_PATH: ${{ github.workspace }}/crates/plico-lvgl/config
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
          components: clippy
      - name: Install LVGL host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev pkg-config libsdl2-dev xvfb xauth xdotool
      - name: Verify native widgets and event round-trip without a window
        run: cargo run --locked -p plico-lvgl --features native --example counter -- --headless --out "$RUNNER_TEMP/plico-lvgl.png"
      - name: Verify SDL mouse, keyboard and window close
        run: xvfb-run -a python3 scripts/check-lvgl-sdl.py
      - name: Check the experimental adapter and example
        run: cargo clippy --locked -p plico-lvgl --features native --all-targets -- -D warnings
