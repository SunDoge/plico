name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Formatting and workspace versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
          components: rustfmt
      - uses: jdx/mise-action@9a35c22ab9022da3f8dbd8c6f42221c5224f78e1 # v5
      - name: Check shared package version and CI test coverage
        run: |
          python3 scripts/check-versions.py
          python3 scripts/ci-tests.py --check
      - name: Check Git-only release configuration
        run: mise exec -- python3 scripts/check-release.py
      - name: Check Rust and component formatting
        run: cargo run --locked -p plico-cli -- fmt --check
      - name: Report unused dependencies
        run: mise exec -- python3 scripts/check-dependencies.py

  lint:
    name: Linux Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      XDG_RUNTIME_DIR: /tmp/plico-ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
          components: clippy
          cache-shared-key: native
      - name: Install native libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libpango1.0-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            fonts-dejavu-core fonts-noto-cjk
      - name: Check every target and feature
        run: cargo clippy --locked --workspace --exclude plico-lvgl --exclude plico-lvgl-esp32p4 --exclude plico-fltk --exclude plico-backend-settings --all-targets --all-features -- -D warnings

  native:
    name: Linux tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [core, rendering, apps]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      XDG_RUNTIME_DIR: /tmp/plico-ci-runtime
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
        with:
          cache-key: tests-${{ matrix.suite }}
      - name: Run assigned workspace tests
        run: python3 scripts/ci-tests.py "${{ matrix.suite }}"
      - name: Verify profiling with and without a trace file
        if: matrix.suite == 'rendering'
        run: |
          env -u PLICO_TRACE_FILE cargo run --locked -p plico-vello --features profiling --example trace_span
          PLICO_TRACE_FILE="$RUNNER_TEMP/plico-trace.json" cargo run --locked -p plico-vello --features profiling --example trace_span

  hot-reload:
    name: Native hot reload and text input
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      XDG_RUNTIME_DIR: /tmp/plico-ci-runtime
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
        with:
          cache-key: hot-reload
      - name: Build the CLI and native development host
        run: cargo build --locked -p plico-cli -p plico-vello
      - name: Verify generated app and reload recovery
        run: python3 scripts/check-hotreload.py
      - name: Verify native text input across reload
        run: python3 scripts/check-text-input-reload.py

  skia:
    name: Skia Vulkan and native windows
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      XDG_RUNTIME_DIR: /tmp/plico-ci-runtime
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-native
        with:
          cache-key: skia
      - name: Check the Skia adapter and shared settings app
        run: cargo clippy --locked -p plico-skia -p plico-backend-settings --features plico-skia/window,plico-backend-settings/skia --all-targets -- -D warnings
      - name: Verify raster replay and shared settings routes
        run: cargo test --locked -p plico-skia -p plico-backend-settings --features plico-skia/window,plico-backend-settings/skia --all-targets
      - name: Verify Vulkan submission, readback and resource lifecycle
        env:
          PLICO_SKIA_DEVICE: llvmpipe
        run: cargo test --locked -p plico-skia --features vulkan --test vulkan -- --ignored --test-threads=1
      - name: Verify window input, resizing and presentation
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: |
          python3 scripts/check-skia-window.py
          python3 scripts/check-skia-settings.py

      - name: Keep failed window captures and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skia-window-failure
          path: |
            reports/skia-window/
            reports/skia-settings/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows build and core tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
      - name: Check the whole workspace compiles on Windows
        run: cargo check --locked --workspace --exclude plico-lvgl --exclude plico-lvgl-esp32p4 --exclude plico-fltk --exclude plico-backend-settings --all-targets --all-features
      - name: Run renderer-independent core tests
        run: cargo test --locked -p plico-core --all-features

  wasm:
    name: WASM host and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: clippy
      - name: Check the renderer-independent core
        run: cargo check --locked -p plico-core --target wasm32-unknown-unknown
      - name: Check the gallery and split host
        run: cargo clippy --locked -p plico-web-host --features gallery,split --target wasm32-unknown-unknown -- -D warnings
      - name: Check the loadable UI module
        run: cargo check --locked -p plico-web-demo --all-features --target wasm32-unknown-unknown

  lvgl:
    name: LVGL backend experiment (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEP_LV_CONFIG_PATH: ${{ github.workspace }}/crates/plico-lvgl/config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
          components: clippy
      - name: Install LVGL host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev pkg-config libsdl2-dev xvfb xauth xdotool
      - name: Verify native widgets and event round-trip without a window
        run: cargo run --locked -p plico-lvgl --features native --example counter -- --headless --out "$RUNNER_TEMP/plico-lvgl.png"
      - name: Verify SDL mouse, keyboard and window close
        run: xvfb-run -a python3 scripts/check-lvgl-sdl.py
      - name: Check the experimental adapter and example
        run: cargo clippy --locked -p plico-lvgl --features native --all-targets -- -D warnings

  fltk:
    name: FLTK and Taffy backend experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@c8ff772090ab9d00f7f7bd7b388f3c3032282e3b # v2
        with:
          toolchain: stable
          components: clippy
      - name: Install FLTK build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev \
            libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev \
            xvfb xauth fonts-noto-cjk
      - name: Check the experimental adapter and shared settings view
        run: cargo clippy --locked -p plico-fltk -p plico-backend-settings --features plico-backend-settings/fltk --all-targets -- -D warnings
      - name: Check animation math and deadline pacing
        run: |
          cargo test --locked -p plico-fltk --features native --lib
          cargo test --locked -p plico-backend-settings --lib
      - name: Verify native event round-trip, retention and window captures
        run: xvfb-run -a python3 scripts/check-fltk.py
