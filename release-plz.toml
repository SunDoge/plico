[workspace]
# The CLI owns the shared tag internally; public PR/release naming is Plico.
pr_name = "chore: release Plico{% if version %} v{{ version }}{% endif %}"
pr_body = """
{% for release in releases %}
{% if release.package == "plico-cli" %}
## Plico v{{ release.next_version }}

All workspace packages use the shared version **{{ release.next_version }}**.
This release creates a Git tag and GitHub Release; it does not publish to crates.io.
{% if release.changelog %}

### Changelog
{% if release.title %}
{{ release.title }}
{% endif %}

{{ release.changelog }}
{% endif %}
{% endif %}
{% endfor %}
{% for release in releases %}
{% if release.breaking_changes %}

### Breaking changes: `{{ release.package }}`

{{ release.breaking_changes }}
{% endif %}
{% endfor %}

---
Generated with [release-plz](https://github.com/release-plz/release-plz/).
"""
# Packages opt into baseline analysis; new members safely inherit the version.
# Do not reconstruct new crates from a shared tag that may predate them.
release = false
git_only = false
publish = false
release_always = false
semver_check = false
dependencies_update = false
# Every package shares workspace.package.version and the same baseline tag.
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "plico-cli"
release = true
git_only = true
# One repository tag and GitHub Release, rather than one for every crate and demo.
git_tag_enable = true
git_release_enable = true
git_release_name = "Plico v{{ version }}"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
    "plico-dev",
    "plico-editor",
    "plico-fltk",
    "plico-lvgl",
    "plico-macros",
    "plico-markdown",
    "plico-motion",
    "plico-native",
    "plico-renderer",
    "plico-runtime",
    "plico-shell",
    "plico-skia",
    "plico-terminal",
    "plico-video",
    "plico-web-host",
]

# Explicit release participants must already exist in the shared baseline tag.
# New workspace members inherit the version but are not analyzed automatically.
# Enable them here after a shared tag contains them; apps remain excluded.
# The renamed `plico` and `plico-desktop` first appear after v0.1.8. The new
# `plico-vello` replaces a different package at that tag. Add all three after
# the next shared tag contains their current implementations.

[[package]]
name = "plico-dev"
release = true
git_only = true

[[package]]
name = "plico-editor"
release = true
git_only = true

[[package]]
name = "plico-fltk"
release = true
git_only = true

[[package]]
name = "plico-lvgl"
release = true
git_only = true

[[package]]
name = "plico-macros"
release = true
git_only = true

[[package]]
name = "plico-markdown"
release = true
git_only = true

[[package]]
name = "plico-motion"
release = true
git_only = true

[[package]]
name = "plico-native"
release = true
git_only = true

[[package]]
name = "plico-renderer"
release = true
git_only = true

[[package]]
name = "plico-runtime"
release = true
git_only = true

[[package]]
name = "plico-shell"
release = true
git_only = true

[[package]]
name = "plico-skia"
release = true
git_only = true

[[package]]
name = "plico-terminal"
release = true
git_only = true

[[package]]
name = "plico-video"
release = true
git_only = true

[[package]]
name = "plico-web-host"
release = true
git_only = true
