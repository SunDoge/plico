[workspace]
# The CLI owns the shared tag internally; public PR/release naming is Plico.
pr_name = "chore: release Plico{% if version %} v{{ version }}{% endif %}"
pr_body = """
{% for release in releases %}
{% if release.package == "plico-cli" %}
## Plico v{{ release.next_version }}

All workspace packages use the shared version **{{ release.next_version }}**.
This release creates a Git tag and GitHub Release; it does not publish to crates.io.
{% if release.changelog %}

### Changelog
{% if release.title %}
{{ release.title }}
{% endif %}

{{ release.changelog }}
{% endif %}
{% endif %}
{% endfor %}
{% for release in releases %}
{% if release.breaking_changes %}

### Breaking changes: `{{ release.package }}`

{{ release.breaking_changes }}
{% endif %}
{% endfor %}

---
Generated with [release-plz](https://github.com/release-plz/release-plz/).
"""
# Released versions come from Git tags; never publish to a Cargo registry.
git_only = true
release_always = false
semver_check = false
dependencies_update = false
# Every package shares workspace.package.version and the same baseline tag.
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "plico-cli"
# One repository tag and GitHub Release, rather than one for every crate and demo.
git_tag_enable = true
git_release_enable = true
git_release_name = "Plico v{{ version }}"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
    "examples",
    "plico-core",
    "plico-dev",
    "plico-editor",
    "plico-fltk",
    "plico-lvgl",
    "plico-macros",
    "plico-markdown",
    "plico-motion",
    "plico-native",
    "plico-renderer",
    "plico-runtime",
    "plico-shell",
    "plico-skia",
    "plico-terminal",
    "plico-vello",
    "plico-web-host",
]

# This unpublished helper is versioned through workspace.package.version only.
# It did not exist at v0.1.1; git_only reconstruction otherwise fails on that tag.
# Disable both release analysis and Git-baseline lookup for this package.
[[package]]
name = "examples"
release = false
git_only = false

[[package]]
name = "backend-settings"
release = false
git_only = false

[[package]]
name = "gallery"
release = false
git_only = false

[[package]]
name = "launcher"
release = false
git_only = false

[[package]]
name = "lvgl-esp32p4"
release = false
git_only = false

[[package]]
name = "services-demo"
release = false
git_only = false

[[package]]
name = "terminal"
release = false
git_only = false

[[package]]
name = "web-demo"
release = false
git_only = false
