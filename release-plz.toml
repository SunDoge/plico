[workspace]
# Released versions come from Git tags; never publish to a Cargo registry.
git_only = true
release_always = false
semver_check = false
dependencies_update = false
# Every package shares workspace.package.version and the same baseline tag.
git_tag_name = "v{{ version }}"
git_tag_enable = false
git_release_enable = false
changelog_update = false

[[package]]
name = "plico-cli"
# One repository tag and GitHub Release, rather than one for every crate and demo.
git_tag_enable = true
git_release_enable = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
    "plico-backend-settings",
    "plico-core",
    "plico-async",
    "plico-dev",
    "plico-editor",
    "plico-fltk",
    "plico-gallery",
    "plico-launcher",
    "plico-lvgl",
    "plico-lvgl-esp32p4",
    "plico-macros",
    "plico-markdown",
    "plico-motion",
    "plico-native",
    "plico-renderer",
    "plico-runtime",
    "plico-services-demo",
    "plico-shell",
    "plico-skia",
    "plico-terminal",
    "plico-terminal-widget",
    "plico-vello",
    "plico-web-demo",
    "plico-web-host",
]
