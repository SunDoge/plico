[package]
name = "plico-desktop"
version.workspace = true
edition.workspace = true
description = "Desktop window host and development CLI for the Plico runtime"

[dependencies]
peniko.workspace = true
plico-runtime = { path = "../plico-runtime" }
plico.workspace = true
plico-renderer.workspace = true
plico-dev.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
snafu.workspace = true

[dev-dependencies]
usage-rs.workspace = true
tempfile.workspace = true
kurbo.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { workspace = true }
gallery = { path = "../../apps/gallery", default-features = false, features = ["host"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plico-wgpu = { path = "../plico-wgpu", optional = true }
pollster = { version = "1.0", optional = true }
plico-shell = { workspace = true, default-features = false }
image = { workspace = true, optional = true, features = ["png"] }
plico-skia = { path = "../plico-skia", optional = true, features = ["raster"] }

[features]
skia = ["plico-shell/skia", "dep:plico-skia", "dep:image"]
wgpu = ["plico-shell/wgpu", "dep:plico-wgpu", "dep:pollster", "dep:image"]
default = ["wgpu"]
profiling = [
    "plico-runtime/profiling",
    "plico-renderer/profiling",
    "plico-shell/profiling",
]

[[example]]
name = "skia-window"
required-features = ["skia"]

[[example]]
name = "local-animation"
required-features = ["skia"]

[[example]]
name = "flatten_profile"
required-features = ["profiling"]

[[example]]
name="wgpu-window"
required-features=["wgpu"]

[[example]]
name = "wgpu-text"
required-features = ["wgpu"]

[[example]]
name = "wgpu-damage-window"
required-features = ["wgpu"]

[[example]]
name = "wgpu-software-probe"
required-features = ["wgpu", "profiling"]
