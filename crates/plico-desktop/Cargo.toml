[package]
name = "plico-desktop"
version.workspace = true
edition.workspace = true
description = "Desktop window host and development CLI for the Plico runtime"

[dependencies]
plico-runtime = { path = "../plico-runtime" }
plico.workspace = true
plico-renderer.workspace = true
plico-dev.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
snafu.workspace = true

[dev-dependencies]
usage-rs.workspace = true
tempfile.workspace = true
kurbo.workspace = true
peniko.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { workspace = true }
gallery = { path = "../../apps/gallery", default-features = false, features = ["host"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plico-shell = { workspace = true, default-features = false }
image = { workspace = true, optional = true, features = ["png"] }
plico-skia = { path = "../plico-skia", optional = true, features = ["raster"] }

[features]
skia = ["plico-shell/skia", "dep:plico-skia", "dep:image"]
vello = ["plico-shell/vello"]
default = ["skia"]
profiling = [
    "plico-runtime/profiling",
    "plico-renderer/profiling",
    "plico-shell/profiling",
]

[[example]]
name = "skia-window"
required-features = ["skia"]

[[example]]
name = "local-animation"
required-features = ["skia"]

[[example]]
name = "flatten_profile"
required-features = ["profiling"]
