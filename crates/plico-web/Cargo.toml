[package]
name = "plico-web"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
gallery = ["dep:plico-gallery"]
split = ["dep:js-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
plico-core.workspace = true
plico-dev.workspace = true
js-sys = { version = "0.3", optional = true }
plico-backend = { path = "../plico-backend", default-features = false }
plico-gallery = { path = "../../apps/gallery", default-features = false, optional = true }
plico-renderer.workspace = true
wasm-bindgen = "0.2"
serde_json.workspace = true
web-sys = { version = "0.3", features = ["Window", "Event", "EventTarget", "HtmlCanvasElement", "DomRect", "Element", "PointerEvent", "KeyboardEvent", "WheelEvent"] }
