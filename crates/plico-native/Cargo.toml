[package]
name = "plico-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
screen-capture = ["dep:ashpd", "ashpd/screenshot", "dep:tokio"]
global-hotkeys = ["dep:global-hotkey", "dep:ashpd", "dep:tokio", "dep:futures-util", "dep:serde_json"]
windows-text = ["dep:windows", "dep:windows-core", "dep:unicode-bidi"]
linux-text = ["dep:cairo-rs", "dep:pango", "dep:pangocairo", "dep:lru", "dep:fontconfig-sys", "dep:tempfile"]

[dependencies]
snafu.workspace = true
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"], optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
global-hotkey = { version = "0.9", path = "../../vendor/global-hotkey", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
futures-util = { version = "0.3", optional = true }
cairo-rs = { version = "0.22", optional = true, features = ["freetype"] }
pango = { version = "0.22", optional = true, features = ["v1_50"] }
pangocairo = { version = "0.22", optional = true }
lru = { version = "0.19.0", optional = true }
fontconfig-sys = { package = "yeslogic-fontconfig-sys", version = "6.0.1", optional = true }
tempfile = { workspace = true, optional = true }

[[example]]
name = "system_text"
required-features = ["linux-text"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
wgpu.workspace = true
pollster = "1.0"
bytemuck = { workspace = true, features = ["derive"] }
plico-skia = { path = "../plico-skia", default-features = false, features = ["raster"] }
kurbo.workspace = true
peniko.workspace = true
plico-renderer.workspace = true
plico-shell = { workspace = true, features = ["vello"] }
image = { workspace = true, features = ["png"] }

[[example]]
name = "screenshot"
required-features = ["screen-capture"]

[[example]]
name = "system_text_wgpu"
path = "examples/system_text_wgpu/main.rs"
required-features = ["linux-text"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", optional = true, default-features = false, features = ["std", "Win32_Graphics_DirectWrite", "Win32_Globalization", "Win32_Foundation"] }
windows-core = { version = "0.62.2", optional = true }
