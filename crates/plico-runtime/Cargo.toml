[package]
name = "plico-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-agnostic declaration runtime for Plico: adapter, source, view and motion"

[dependencies]
peniko.workspace = true
kurbo.workspace = true
web-time = "1.1"
plico.workspace = true
parley.workspace = true
zeroize = "1.9"
plico-renderer.workspace = true
plico-motion.workspace = true
taffy.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
plico-dev.workspace = true
snafu.workspace = true
tracing.workspace = true
notify = { workspace = true, optional = true }

[dev-dependencies]
gallery = { path = "../../apps/gallery" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
plico-shell.workspace = true

[features]
# Restricted benchmark hook; does not introduce a reactive runtime.
experiment-patch = ["plico/experiment-patch"]
default = []
hot-reload = ["plico-dev/host", "dep:notify"]
profiling = ["plico-renderer/profiling"]
