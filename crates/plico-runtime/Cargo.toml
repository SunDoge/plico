[package]
name = "plico-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-agnostic declaration runtime for Plico: adapter, source, view and motion"

[dependencies]
unicode-segmentation = "1.12"
peniko.workspace = true
kurbo.workspace = true
web-time = "1.1"
plico.workspace = true
zeroize = "1.9"
plico-renderer.workspace = true
plico-motion.workspace = true
taffy.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
snafu.workspace = true
tracing.workspace = true

[dev-dependencies]
gallery = { path = "../../apps/gallery" }
plico-dev.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
plico-shell.workspace = true

[features]
default = []
profiling = ["plico-renderer/profiling"]
