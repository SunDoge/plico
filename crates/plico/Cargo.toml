[package]
name = "plico"
version.workspace = true
edition.workspace = true
description = "Immediate-mode Plico UI engine and shared types"
publish = false

[features]
# Optional portable layout adapter for native-widget backends.
taffy = ["dep:taffy"]

[dependencies]
taffy = { workspace = true, optional = true }
rmp-serde.workspace = true
web-time = "1.1"
snafu.workspace = true
serde = { workspace = true, features = ["derive"] }
slotmap.workspace = true
plico-macros = { path = "../plico-macros" }
bitflags = { workspace = true, features = ["serde"] }

zeroize = "1.9"
unicode-segmentation = "1.12"

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1", features = ["std"] }

[dev-dependencies]
serde_json.workspace = true
