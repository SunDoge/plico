[package]
name = "plico-lvgl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Minimal LVGL backend experiment for Plico declarations"

[features]
default = []
native = ["external"]
# Externally initialized LVGL, using the ESP-IDF build adapter in esp-idf/.
external = ["dep:lightvgl-sys"]

[dependencies]
plico-core.workspace = true
snafu.workspace = true
lightvgl-sys = { version = "=9.5.5", optional = true }
png = "0.17"

[dev-dependencies]
usage-rs.workspace = true

[build-dependencies]
cc = "1"
pkg-config = "0.3"
toml = "1"

# cc/pkg-config compile native code; toml reads the exact source version in build.rs, which
# cargo-machete does not scan.
[package.metadata.cargo-machete]
ignored = ["cc", "pkg-config", "toml"]

[[example]]
name = "counter"
required-features = ["native"]
