[package]
name = "plico-nsh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Plico immediate declarations projected to NSH native elements"

[features]
default = []
native = [
    "dep:nsh-platform-linux",
    "dep:nsh-platform-macos",
    "dep:nsh-platform-windows",
]

[dependencies]
plico.workspace = true
snafu.workspace = true
nsh-core = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3.0", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false, optional = true }

[[example]]
name = "counter"
required-features = ["native"]
