[package]
name = "plico-web-host"
version.workspace = true
edition.workspace = true
description = "Browser host for Plico rendering, input and loadable UI modules"
publish = false

[package.metadata.cargo-machete]
# Referenced by bindings generated for async #[wasm_bindgen] functions.
ignored = ["wasm-bindgen-futures"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["wgpu"]
wgpu = ["dep:js-sys", "dep:plico-wgpu", "dep:wasm-bindgen-futures"]
gallery = ["dep:gallery", "dep:plico-app-host", "wgpu"]
split = ["dep:rkyv", "dep:web-demo", "wgpu"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-demo = { path = "../../apps/web-demo", optional = true }
rkyv = { workspace = true, optional = true }
plico-wgpu = { path = "../plico-wgpu", default-features = false, features = ["web"], optional = true }
plico.workspace = true
plico-dev.workspace = true
js-sys = { version = "0.3", optional = true }
plico-runtime = { path = "../plico-runtime" }
plico-app-host = { workspace = true, optional = true }
gallery = { path = "../../apps/gallery", default-features = false, optional = true }
plico-renderer.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = { version = "0.4", optional = true }
serde_json.workspace = true
web-sys = { version = "0.3", features = ["console", "Window", "Event", "EventTarget", "HtmlCanvasElement", "DomRect", "Element", "PointerEvent", "KeyboardEvent", "WheelEvent"] }
