[package]
name = "plico-web-host"
version.workspace = true
edition.workspace = true
description = "Browser host for Plico rendering, input and loadable UI modules"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["wgpu"]
wgpu = ["dep:plico-wgpu", "dep:wasm-bindgen-futures"]
gallery = ["dep:gallery"]
split = ["dep:js-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
plico-wgpu = { path = "../plico-wgpu", default-features = false, features = ["web"], optional = true }
plico.workspace = true
plico-dev.workspace = true
js-sys = { version = "0.3", optional = true }
plico-runtime = { path = "../plico-runtime" }
gallery = { path = "../../apps/gallery", default-features = false, optional = true }
plico-renderer.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = { version = "0.4", optional = true }
serde_json.workspace = true
web-sys = { version = "0.3", features = ["console", "Window", "Event", "EventTarget", "HtmlCanvasElement", "DomRect", "Element", "PointerEvent", "KeyboardEvent", "WheelEvent"] }
