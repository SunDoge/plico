[package]
name = "plico-csharp"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plico.workspace = true
plico-runtime.workspace = true
plico-renderer.workspace = true
plico-desktop = { path = "../plico-desktop", default-features = false, features = ["wgpu"] }
image = { workspace = true, features = ["png", "jpeg", "webp"] }
snafu.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize = "1"

[build-dependencies]
csbindgen = "=1.9.8"

[dev-dependencies]
usage-rs.workspace = true
