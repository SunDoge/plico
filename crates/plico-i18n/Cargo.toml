[package]
name = "plico-i18n"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Fluent messages and trimmed ICU4X formatting for Plico"

[features]
default = ["embedded-data"]
# Only English and Simplified Chinese, generated by scripts/generate-i18n-data.sh.
# Disable to supply an application-specific ICU4X blob to Catalog::with_data.
embedded-data = []

[dependencies]
plico.workspace = true
snafu.workspace = true
fluent-bundle = "0.16"
unic-langid = "0.9"
icu_calendar = { version = "=2.3.0", default-features = false }
icu_datetime = { version = "=2.3.0", default-features = false, features = ["serde"] }
icu_decimal = { version = "=2.3.0", default-features = false, features = ["serde"] }
icu_locale = { version = "=2.3.0", default-features = false, features = ["serde"] }
icu_locale_core = { version = "=2.3.0", default-features = false }
[package.metadata.cargo-machete]
# icu_provider is a feature-flag dependency: "sync" makes the blob provider
# Send+Sync for static catalogs without any direct source reference.
ignored = ["icu_provider"]

# The sync feature makes the blob provider Send+Sync for static catalogs.
icu_provider = { version = "=2.3.0", default-features = false, features = ["sync"] }
icu_provider_adapters = { version = "=2.3.0", default-features = false }
icu_provider_blob = { version = "=2.3.0", default-features = false, features = ["alloc"] }
writeable = "0.6"
