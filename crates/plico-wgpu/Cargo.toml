[package]
name = "plico-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Experimental instanced-quad wgpu renderer for Plico"

[features]
default = ["system-text"]
system-text = ["dep:plico-native"]
web = ["wgpu/webgl", "dep:web-sys", "dep:wasm-bindgen", "dep:js-sys", "dep:unicode-segmentation"]
window = ["dep:winit", "dep:raw-window-handle"]

[target.'cfg(target_os = "linux")'.dependencies]
plico-native = { path = "../plico-native", default-features = false, features = ["linux-text"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
plico-native = { path = "../plico-native", default-features = false, features = ["windows-text"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
plico-native = { path = "../plico-native", default-features = false, features = ["macos-text"], optional = true }

[dependencies]
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }
winit = {workspace=true,optional=true}
raw-window-handle = {version="0.6",optional=true}
plico-renderer.workspace = true
kurbo.workspace = true
peniko.workspace = true
wgpu.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
naga.workspace = true
snafu.workspace = true
tracing.workspace = true
pollster = "1.0"
lru = "0.19.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
plico.workspace = true
plico-runtime.workspace = true
winit.workspace = true
raw-window-handle = "0.6"
plico-renderer.workspace = true
kurbo.workspace = true
peniko.workspace = true
image = { workspace = true, features = ["png"] }

[[example]]
name = "image-minification"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d", "TextMetrics", "ImageData"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
unicode-segmentation = { version = "1.13", optional = true }
