[package]
name = "plico-cli"
version.workspace = true
edition.workspace = true
description = "Development commands for the Plico workspace"
publish = false

[[bin]]
name = "plico"
path = "src/main.rs"

[dependencies]
usage-rs.workspace = true
snafu.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
notify.workspace = true
ctrlc = "3.5"
cargo_metadata.workspace = true
tempfile.workspace = true
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Keep shader formatting in the development CLI, outside application dependencies.
wgsl-formatter = { git = "https://github.com/wgsl-analyzer/wgsl-analyzer", tag = "2026-11-02.1" }
wgsl-parser = { package = "parser", git = "https://github.com/wgsl-analyzer/wgsl-analyzer", tag = "2026-11-02.1" }
