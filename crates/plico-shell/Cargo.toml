[package]
name = "plico-shell"
version.workspace = true
edition = "2024"

license.workspace = true
publish = false

[lib]
name = "plico_shell"
path = "src/lib.rs"

[dependencies]
peniko.workspace = true
kurbo.workspace = true
plico-renderer = { path = "../plico-renderer" }
plico-skia = { path = "../plico-skia", optional = true, features = ["window"] }
accesskit = "0.24.1"
futures-util = "0.3"
image = { workspace = true, features = ["ico", "jpeg", "png", "webp"] }
parley = { workspace = true }
raw-window-handle = "0.6"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
slotmap = { workspace = true }
snafu = { workspace = true }
tracing = { workspace = true }
tracing-chrome = { version = "0.7.2", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "registry"] }
url = { workspace = true }

[features]
default = ["wgpu"]
wgpu = ["dep:plico-wgpu", "dep:pollster"]
desktop-integration = ["dep:tray-icon", "dep:zbus"]
global-hotkeys = ["dep:plico-native", "plico-native/global-hotkeys"]
skia = ["dep:plico-skia"]
profiling = ["plico-skia?/profiling", "plico-renderer/profiling", "dep:tracing-chrome", "dep:tracing-subscriber"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plico-wgpu = { path = "../plico-wgpu", optional = true, features = ["window"] }
pollster = {version="1.0",optional=true}
accesskit_xplat = "=0.1.1"
arboard = { workspace = true }
notify-rust = { workspace = true }
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"], optional = true }
open = { workspace = true }
rfd = { workspace = true }
winit = { workspace = true }

plico-native = { path = "../plico-native", optional = true }

[dev-dependencies]
skrifa = { version = "0.44", default-features = false, features = ["std"] }
usage-rs.workspace = true
taffy.workspace = true
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSScreen"] }

[[example]]
name = "global_hotkeys"
required-features = ["global-hotkeys"]

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", features = ["blocking-api"], optional = true }
