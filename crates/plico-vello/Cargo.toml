[package]
name = "plico-vello"
version.workspace = true
edition.workspace = true
description = "Taffy/Parley/Vello backend and desktop host integration for Plico"
default-run = "plico-vello"

[dependencies]
web-time = "1.1"
plico-core.workspace = true
parley.workspace = true
zeroize = "1.9"
plico-renderer.workspace = true
plico-motion.workspace = true
taffy.workspace = true
vello-common.workspace = true
serde_json.workspace = true

plico-dev.workspace = true

snafu.workspace = true
notify = { workspace = true, optional = true }

serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
image = { workspace = true }
plico-gallery = { path = "../../apps/gallery" }

[features]
default = ["hot-reload"]
hot-reload = ["plico-dev/host", "dep:notify", "dep:usage-rs"]
profiling = ["plico-renderer/profiling", "plico-shell/profiling"]

[[bin]]
name = "plico-vello"
path = "src/main.rs"
required-features = ["hot-reload"]

[[example]]
name = "game2048-reload"
required-features = ["hot-reload"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plico-shell.workspace = true
tracing.workspace = true
usage-rs = { workspace = true, optional = true }
