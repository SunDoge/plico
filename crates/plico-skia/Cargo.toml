[package]
name = "plico-skia"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Skia CPU and Vulkan consumers for the Plico command stream"

[features]
default = []
profiling = ["dep:tracing"]
# Consumes the backend-neutral command stream with Skia raster surfaces.
raster = ["dep:skia-safe", "dep:plico-renderer", "dep:kurbo", "dep:peniko", "dep:lru"]
# Ganesh Vulkan render targets; never falls back to CPU raster.
vulkan = ["raster", "skia-safe/vulkan", "skia-safe/ganesh", "dep:ash"]
window = ["vulkan", "dep:ash-window", "dep:raw-window-handle", "dep:winit"]

[dependencies]
peniko = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
plico-renderer = { path = "../plico-renderer", optional = true }
skia-safe = { version = "0.153", optional = true, features = ["textlayout"] }
snafu.workspace = true
lru = { version = "0.19", optional = true }
ash = { version = "0.38", optional = true }
ash-window = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }
winit = { workspace = true, optional = true }

[dev-dependencies]
vello-common.workspace = true
plico.workspace = true
plico-runtime = { path = "../plico-runtime" }
taffy.workspace = true
plico-shell.workspace = true
image = { workspace = true, features = ["png"] }

[[example]]
name = "compare"
required-features = ["raster"]

[[example]]
name = "damage_window"
required-features = ["window"]

[[example]]
name = "damage_compare"
required-features = ["raster"]

[[example]]
name = "text_motion"
required-features = ["vulkan"]
