[package]
name = "plico-terminal-widget"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "Native terminal widget for Plico's renderer."

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plico-core.workspace = true
plico-renderer.workspace = true
percent-encoding = "2"
rio-graphics = "0.5.28"
rio-vt = "0.5.28"
rustc-hash = "2"
serde_json = { workspace = true }
teletypewriter = "0.5.28"
tracing = { workspace = true }
vello-common.workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2"
