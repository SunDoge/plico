[package]
name = "plico-backend-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
fltk = ["dep:plico-fltk", "plico-fltk/native", "dep:fltk-native"]
vello = ["dep:plico-vello", "dep:plico-renderer"]
skia = ["vello", "plico-vello/skia", "dep:plico-skia", "dep:tracing-subscriber"]

[dependencies]
plico-core.workspace = true
plico-skia = { path = "../../crates/plico-skia", optional = true, features = ["raster"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
plico-renderer = { workspace = true, optional = true }
plico-motion.workspace = true
fltk-native = { package = "fltk", version = "1.5", optional = true }
plico-fltk = { path = "../../crates/plico-fltk", optional = true }
plico-vello = { path = "../../crates/plico-vello", optional = true, default-features = false }

[[bin]]
name = "settings-fltk"
path = "src/bin/fltk.rs"
required-features = ["fltk"]

[[bin]]
name = "settings-vello"
path = "src/bin/vello.rs"
required-features = ["vello"]

[[example]]
name = "fltk_probe"
required-features = ["fltk"]

[[example]]
name = "fltk_schedule_probe"
required-features = ["fltk"]

[[bin]]
name = "settings-skia"
path = "src/bin/skia.rs"
required-features = ["skia"]

[dev-dependencies]
vello-common.workspace = true
