[package]
name = "backend-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
fltk = ["dep:plico-fltk", "plico-fltk/native", "dep:fltk-native"]
vello = ["dep:plico-desktop", "dep:plico-renderer", "dep:plico-runtime", "dep:plico-shell"]
skia = ["dep:plico-runtime", "dep:plico-renderer", "dep:plico-shell", "plico-shell/skia", "dep:plico-skia", "dep:tracing-subscriber"]
egui = [
    "dep:plico-egui",
    "dep:plico-runtime",
    "dep:plico-renderer",
    "dep:plico-shell",
    "plico-shell/egui",
    "dep:tracing-subscriber",
]

[dependencies]
plico-egui = { path = "../../crates/plico-egui", optional = true, features = ["widgets"] }
usage-rs.workspace = true
snafu.workspace = true
plico.workspace = true
plico-skia = { path = "../../crates/plico-skia", optional = true, features = ["raster"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
plico-renderer = { workspace = true, optional = true }
plico-motion.workspace = true
fltk-native = { package = "fltk", version = "1.5", optional = true }
plico-fltk = { path = "../../crates/plico-fltk", optional = true }
plico-desktop = { path = "../../crates/plico-desktop", optional = true, default-features = false }
plico-runtime = { path = "../../crates/plico-runtime", optional = true }
plico-shell = { path = "../../crates/plico-shell", optional = true }

[[example]]
name = "sidebar_capture"
required-features = ["vello"]

[[example]]
name = "fltk_probe"
required-features = ["fltk"]

[[example]]
name = "fltk_schedule_probe"
required-features = ["fltk"]

[dev-dependencies]
peniko.workspace = true

[[example]]
name = "damage_probe"
required-features = ["skia"]
