[package]
name = "services-demo"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = ["desktop"]
desktop = ["dep:plico-desktop"]

[dependencies]
plico.workspace = true
plico-dev.workspace = true
plico-runtime.workspace = true
plico-desktop = { path = "../../crates/plico-desktop", optional = true, default-features = false, features = ["skia"] }
serde = { workspace = true, features = ["derive"] }

[[bin]]
name = "services-demo"
required-features = ["desktop"]

[dev-dependencies]
serde_json.workspace = true
snafu.workspace = true
usage-rs.workspace = true
tempfile.workspace = true
plico-renderer.workspace = true
plico-shell.workspace = true

[[example]]
name = "services-capture"
path = "examples/capture.rs"
required-features = ["desktop"]
