[package]
name = "plico-web-demo"
version.workspace = true
edition.workspace = true
description = "Loadable UI demo for the Plico split-WASM browser host"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
revised = []
schema-reset = []

[dependencies]
plico-core.workspace = true
plico-dev.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
