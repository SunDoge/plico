[package]
name = "android-counter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
plico.workspace = true
plico-runtime.workspace = true
plico-android = { path = "../../crates/plico-android" }

[package.metadata.android]
package = "dev.plico.counter"
resources = "res"
build_targets = ["x86_64-linux-android", "aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
has_code = true
theme = "@style/PlicoCounter"

[package.metadata.android.application.activity]
name = "dev.plico.PlicoActivity"
