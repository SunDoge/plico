[package]
name = "gallery"
version.workspace = true
edition.workspace = true
publish = false
default-run = "gallery"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
snafu.workspace = true
plico-desktop = { path = "../../crates/plico-desktop", optional = true, default-features = false }
plico.workspace = true
plico-motion.workspace = true
plico-markdown = { path = "../../crates/plico-markdown" }
plico-dev.workspace = true
serde = { workspace = true, features = ["derive"] }

[features]
abi = ["plico-dev/abi", "dep:stabby"]
default = ["desktop"]
desktop = ["dep:plico-desktop", "dep:plico-renderer", "dep:ureq", "dep:directories"]
profiling = ["plico-desktop/profiling"]

[[bin]]
name = "gallery"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "probe"
path = "examples/probe.rs"
required-features = ["desktop"]

[[example]]
name = "capture"
required-features = ["desktop"]

[dev-dependencies]
image = { workspace = true, features = ["gif"] }
plico-renderer = { workspace = true }
plico-shell = { workspace = true }
usage-rs = { workspace = true }
snafu = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "game2048"
required-features = ["desktop"]

[[example]]
name = "motion_probe"
required-features = ["desktop"]

# The export macro generates native ABI references to this crate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stabby = { workspace = true, optional = true }

[package.metadata.cargo-machete]
ignored = ["stabby"]

[[example]]
name = "code_editor"
required-features = ["desktop"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
plico-editor = { path = "../../crates/plico-editor" }

[[example]]
name = "zoom"
required-features = ["desktop"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ureq]
version = "3.5"
default-features = false
features = ["rustls"]
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.directories]
workspace = true
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.plico-renderer]
workspace = true
optional = true
