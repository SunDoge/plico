[package]
name = "examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
plico.workspace = true
plico-desktop = { path = "crates/plico-desktop", default-features = false, features = ["wgpu"] }
plico-dev.workspace = true
plico-runtime.workspace = true

[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = ["crates/plico-desktop/reference", "vendor/global-hotkey"]
# The main development targets: core engine, CLI, and the gallery app.
default-members = [".", "apps/gallery", "crates/plico", "crates/plico-cli"]

[workspace.package]
version = "0.4.6"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
bitflags = "2.13.2"
bytemuck = "1.25.2"
directories = "6.0.0"
ffmpeg-sidecar = { version = "2.7.0", default-features = false }
image = { version = "0.25", default-features = false }
interprocess = "2.4.3"
kurbo = "0.13.1"
naga = { version = "30", features = ["wgsl-in"] }
notify-rust = "=4.18.2"
open = "5.4.4"
parley = { version = "0.12", features = ["bytemuck", "complex-scripts"] }
peniko = "0.6.1"
plico-motion = { path = "crates/plico-motion" }
plico-node-editor = { path = "crates/plico-node-editor" }
rfd = "0.17.2"
rkyv = { version = "=0.8.18", features = ["little_endian", "pointer_width_32", "unaligned"] }
rmp-serde = "1.3"
serde = "1"
serde_json = "1"
slotmap = "1.1.1"
snafu = "0.9.2"
# Keep calc disabled: Plico and nsh-core 0.5 share the non-calc Taffy surface.
taffy = { version = "0.15.0", default-features = false, features = ["block_layout", "content_size", "detailed_layout_info", "flexbox", "flexbox_balance", "float_layout", "grid", "std", "taffy_tree"] }
tracing = "0.1"
url = "2.5.8"
usvg = { version = "0.48.1", default-features = false, features = ["text"] }
wgpu = "30.0.2"
winit = "=0.31.0-beta.3"
zeroize = "1.9"

plico = { path = "crates/plico" }
plico-renderer = { path = "crates/plico-renderer" }
plico-shell = { path = "crates/plico-shell", default-features = false }

cargo_metadata = "0.23"
notify = "8.2"
plico-app-host = { path = "crates/plico-app-host" }
plico-dev = { path = "crates/plico-dev" }
plico-runtime = { path = "crates/plico-runtime" }
tempfile = "3"
usage-rs = "7.0.0"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

# Optimize dependencies for runtime performance without generating their debug info.
[profile.dev.package."*"]
opt-level = 2
debug = false

# UI applications prioritize edit/build latency; framework crates stay optimized.
[profile.dev.package.gallery]
opt-level = 0

# CI executes correctness checks, not performance benchmarks. Avoid optimizing
# formatter/test dependencies; normal development keeps its optimized runtime.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0
