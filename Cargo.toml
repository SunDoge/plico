[package]
name = "examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
plico-core.workspace = true
plico-dev.workspace = true
plico-vello = { path = "crates/plico-vello", default-features = false }
serde = { workspace = true, features = ["derive"] }

[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["crates/plico-vello/reference", "vendor/global-hotkey"]
# The immediate-mode mainline: core engine, CLI, and the gallery app.
default-members = [".", "crates/plico-core", "crates/plico-cli", "apps/gallery"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
bitflags = "2.13.2"
bytemuck = "1.25.2"
directories = "6.0.0"
glifo = "0.4"
image = { version = "0.25", default-features = false }
naga = { version = "30", features = ["wgsl-in"] }
notify-rust = "=4.18.2"
open = "5.4.4"
parley = { version = "0.12", features = ["bytemuck", "complex-scripts"] }
rfd = "0.17.2"
serde = "1"
serde_json = "1"
rmp-serde = "1.3"
slotmap = "1.1.1"
snafu = "0.9.2"
taffy = "0.15.0"
tracing = "0.1"
url = "2.5.8"
usvg = { version = "0.48.1", default-features = false, features = ["text"] }
vello-common = { package = "vello_common", version = "0.3.0" }
zeroize = "1.9"
vello-gpu = { package = "vello_gpu", version = "0.3.0", default-features = false }
plico-motion = { path = "crates/plico-motion" }
wgpu = "30"
wgpu-context = { package = "wgpu_context", version = "0.10.0" }
winit = "=0.31.0-beta.3"

plico-core = { path = "crates/plico-core" }
plico-renderer = { path = "crates/plico-renderer" }
plico-shell = { path = "crates/plico-shell" }

cargo_metadata = "0.23"
libloading = "0.9"
notify = "8.2"
plico-dev = { path = "crates/plico-dev" }
stabby = "72.1.16"
tempfile = "3"
usage-rs = "7.0.0"

[profile.dev]
opt-level = 1
incremental = true
